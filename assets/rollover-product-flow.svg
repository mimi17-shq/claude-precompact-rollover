<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manual context assembly before Claude compaction</title>
  <desc id="desc">Four phone screens show a normal conversation, memory reminder, manual context assembly with recent tokens, pinned and hidden messages, and verified continuation after rollover.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8ca4b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #183247; }
      .label { font-size: 17px; font-weight: 700; fill: #284b63; }
      .header { font-size: 14px; font-weight: 700; fill: white; }
      .small { font-size: 11px; fill: #607789; }
      .body { font-size: 12px; fill: #24455c; }
      .system-title { font-size: 13px; font-weight: 700; fill: #315b79; }
      .chip { font-size: 10px; font-weight: 600; fill: #35627f; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#f4f8fb"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#23465f">Assemble context before a 200k window compacts</text>
  <text x="600" y="56" text-anchor="middle" class="small">Recent verbatim turns + Pin − Hide · Local interface for any frontend or app</text>

  <line x1="289" y1="362" x2="316" y2="362" stroke="#8ca4b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="579" y1="362" x2="606" y2="362" stroke="#8ca4b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="869" y1="362" x2="896" y2="362" stroke="#8ca4b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(30 100)">
    <text x="130" y="-10" text-anchor="middle" class="label">1 · Conversation</text>
    <rect width="260" height="530" rx="28" fill="#17232d" filter="url(#shadow)"/>
    <rect x="8" y="8" width="244" height="514" rx="22" fill="#e9f1f6"/>
    <rect x="8" y="8" width="244" height="56" rx="22" fill="#5682a3"/>
    <rect x="8" y="42" width="244" height="22" fill="#5682a3"/>
    <circle cx="31" cy="35" r="14" fill="#d7e7f2"/>
    <text x="52" y="32" class="header">Claude</text>
    <text x="52" y="48" font-size="10" fill="#dceaf3">200k · 138k used</text>
    <rect x="69" y="92" width="165" height="56" rx="14" fill="#d7f2c8"/>
    <text x="82" y="115" class="body">Continue the design.</text>
    <text x="82" y="133" class="body">Let's handle edge cases.</text>
    <rect x="22" y="166" width="188" height="72" rx="14" fill="#ffffff"/>
    <text x="35" y="190" class="body">Sure. First, separate the</text>
    <text x="35" y="208" class="body">normal and rescue paths,</text>
    <text x="35" y="226" class="body">then define acceptance.</text>
    <rect x="20" y="456" width="220" height="38" rx="12" fill="#f7fafc" stroke="#c8d8e3"/>
    <text x="130" y="480" text-anchor="middle" class="chip">Pin · Hide · Assemble next context</text>
  </g>

  <g transform="translate(320 100)">
    <text x="130" y="-10" text-anchor="middle" class="label">2 · Memory reminder</text>
    <rect width="260" height="530" rx="28" fill="#17232d" filter="url(#shadow)"/>
    <rect x="8" y="8" width="244" height="514" rx="22" fill="#e9f1f6"/>
    <rect x="8" y="8" width="244" height="56" rx="22" fill="#5682a3"/>
    <rect x="8" y="42" width="244" height="22" fill="#5682a3"/>
    <circle cx="31" cy="35" r="14" fill="#d7e7f2"/>
    <text x="52" y="32" class="header">Claude</text>
    <text x="52" y="48" font-size="10" fill="#dceaf3">200k · 140k used</text>
    <rect x="22" y="116" width="216" height="150" rx="18" fill="#ffffff" stroke="#b8d1e0"/>
    <circle cx="130" cy="148" r="18" fill="#e7f3fa"/>
    <path d="M124 148h12M130 142v12" stroke="#5682a3" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="185" text-anchor="middle" class="system-title">Prepare durable memory</text>
    <text x="130" y="210" text-anchor="middle" class="body">Save what must survive rollover.</text>
    <text x="130" y="232" text-anchor="middle" class="small">The conversation can continue.</text>
    <rect x="53" y="286" width="154" height="34" rx="17" fill="#5682a3"/>
    <text x="130" y="307" text-anchor="middle" font-size="11" font-weight="700" style="fill:white">Saved · Continue</text>
  </g>

  <g transform="translate(610 100)">
    <text x="130" y="-10" text-anchor="middle" class="label">3 · Assemble next context</text>
    <rect width="260" height="530" rx="28" fill="#17232d" filter="url(#shadow)"/>
    <rect x="8" y="8" width="244" height="514" rx="22" fill="#e9f1f6"/>
    <rect x="8" y="8" width="244" height="56" rx="22" fill="#5682a3"/>
    <rect x="8" y="42" width="244" height="22" fill="#5682a3"/>
    <circle cx="31" cy="35" r="14" fill="#d7e7f2"/>
    <text x="52" y="32" class="header">Claude</text>
    <text x="52" y="48" font-size="10" fill="#dceaf3">200k · 155k used</text>
    <rect x="20" y="88" width="220" height="320" rx="18" fill="#ffffff" stroke="#b8d1e0"/>
    <text x="130" y="121" text-anchor="middle" class="system-title">Rollover is ready</text>
    <text x="130" y="143" text-anchor="middle" class="small">Waiting for the reply to finish.</text>
    <text x="38" y="178" class="small">Next model</text>
    <rect x="36" y="188" width="188" height="42" rx="10" fill="#f3f7fa" stroke="#c9d8e2"/>
    <text x="52" y="214" class="body">Opus</text><text x="208" y="214" text-anchor="end" class="small">⌄</text>
    <text x="38" y="258" class="small">Effort</text>
    <rect x="36" y="268" width="188" height="42" rx="10" fill="#f3f7fa" stroke="#c9d8e2"/>
    <text x="52" y="294" class="body">High</text><text x="208" y="294" text-anchor="end" class="small">⌄</text>
    <rect x="36" y="325" width="188" height="40" rx="12" fill="#e7f3fa"/>
    <text x="130" y="342" text-anchor="middle" class="chip">12k recent · 2 pins · 1 hidden</text>
    <text x="130" y="357" text-anchor="middle" class="small">Full turns · tool noise removed</text>
    <rect x="43" y="374" width="174" height="34" rx="17" fill="#5682a3"/>
    <text x="130" y="395" text-anchor="middle" font-size="10" font-weight="700" style="fill:white">Verify &amp; build next window</text>
  </g>

  <g transform="translate(900 100)">
    <text x="130" y="-10" text-anchor="middle" class="label">4 · Continue the thread</text>
    <rect width="260" height="530" rx="28" fill="#17232d" filter="url(#shadow)"/>
    <rect x="8" y="8" width="244" height="514" rx="22" fill="#e9f1f6"/>
    <rect x="8" y="8" width="244" height="56" rx="22" fill="#5682a3"/>
    <rect x="8" y="42" width="244" height="22" fill="#5682a3"/>
    <circle cx="31" cy="35" r="14" fill="#d7e7f2"/>
    <text x="52" y="32" class="header">Claude</text>
    <text x="52" y="48" font-size="10" fill="#dceaf3">new window · ready</text>
    <rect x="36" y="88" width="188" height="96" rx="16" fill="#ffffff" stroke="#9fc9ad"/>
    <text x="130" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#30704a">NEW WINDOW READY</text>
    <text x="130" y="140" text-anchor="middle" class="small">Digest matched · Tool noise removed</text>
    <text x="130" y="162" text-anchor="middle" class="small">Opus · Effort High</text>
    <rect x="60" y="210" width="174" height="54" rx="14" fill="#d7f2c8"/>
    <text x="74" y="233" class="body">Let's continue the rescue</text>
    <text x="74" y="251" class="body">flow from before.</text>
    <rect x="22" y="282" width="188" height="70" rx="14" fill="#ffffff"/>
    <text x="35" y="306" class="body">Got it. The normal path is set.</text>
    <text x="35" y="324" class="body">Next: post-compaction rescue</text>
    <text x="35" y="342" class="body">and acceptance criteria.</text>
  </g>

  <rect x="140" y="642" width="920" height="48" rx="24" fill="#fff4de" stroke="#e5bf72"/>
  <circle cx="174" cy="666" r="13" fill="#f4cf83"/>
  <text x="174" y="671" text-anchor="middle" font-size="15" font-weight="700" fill="#805a12">!</text>
  <text x="198" y="671" font-size="13" font-weight="600" fill="#6f541f">Rescue path: a huge tool result triggers compaction · Recover full recent turns from the original transcript</text>
</svg>
